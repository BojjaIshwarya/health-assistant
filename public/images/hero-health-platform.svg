<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="55%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="520" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Backdrop Orbs -->
  <circle cx="670" cy="110" r="130" fill="#99f6e4" fill-opacity="0.35"/>
  <circle cx="130" cy="430" r="110" fill="#a5f3fc" fill-opacity="0.35"/>

  <!-- Main Clinical Tablet Frame -->
  <g filter="url(#softShadow)">
    <rect x="115" y="65" width="520" height="365" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="135" y="85" width="480" height="325" rx="20" fill="#f8fafc"/>
  </g>

  <!-- Tablet Top Header -->
  <rect x="135" y="85" width="480" height="54" rx="20" fill="#ffffff"/>
  <rect x="135" y="120" width="480" height="19" fill="#ffffff"/>
  <line x1="135" y1="139" x2="615" y2="139" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Medical Cross Logo on Tablet -->
  <rect x="158" y="99" width="28" height="28" rx="8" fill="url(#tealCard)"/>
  <path d="M172 106v14M165 113h14" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="196" y="105" width="120" height="8" rx="4" fill="#0f172a"/>
  <rect x="196" y="118" width="76" height="5" rx="2.5" fill="#94a3b8"/>

  <!-- ECG Heartbeat Waveform Card -->
  <rect x="155" y="156" width="295" height="145" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="175" y="172" width="90" height="7" rx="3.5" fill="#64748b"/>
  <rect x="175" y="185" width="54" height="12" rx="6" fill="#0d9488"/>
  <path d="M175 252 L222 252 L236 252 L248 220 L262 276 L276 198 L291 268 L305 236 L317 252 L428 252"
        stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="276" cy="198" r="6" fill="#14b8a6"/>
  <circle cx="276" cy="198" r="11" fill="#14b8a6" fill-opacity="0.22"/>

  <!-- Side Vitals Metrics Column -->
  <rect x="466" y="156" width="130" height="66" rx="14" fill="url(#tealCard)"/>
  <rect x="482" y="172" width="58" height="6" rx="3" fill="#ccfbf1"/>
  <rect x="482" y="188" width="84" height="16" rx="5" fill="#ffffff"/>

  <rect x="466" y="235" width="130" height="66" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="490" cy="268" r="14" fill="#ecfdf5"/>
  <path d="M484 268l4 4 8-9" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="513" y="257" width="66" height="7" rx="3.5" fill="#334155"/>
  <rect x="513" y="271" width="48" height="6" rx="3" fill="#94a3b8"/>

  <!-- Bottom Consultation Cards Row -->
  <rect x="155" y="315" width="138" height="78" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="182" cy="342" r="12" fill="#eff6ff"/>
  <path d="M177 342h10M182 337v10" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <rect x="170" y="364" width="96" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="170" y="376" width="68" height="5" rx="2.5" fill="#94a3b8"/>

  <rect x="307" y="315" width="138" height="78" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="334" cy="342" r="12" fill="#fef3c7"/>
  <circle cx="334" cy="342" r="5" fill="#d97706"/>
  <rect x="322" y="364" width="96" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="322" y="376" width="74" height="5" rx="2.5" fill="#94a3b8"/>

  <rect x="458" y="315" width="138" height="78" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="485" cy="342" r="12" fill="#ffe4e6"/>
  <path d="M485 347s-5-3.3-5-6.5a3 3 0 0 1 5-2.2 3 3 0 0 1 5 2.2c0 3.2-5 6.5-5 6.5z" fill="#e11d48"/>
  <rect x="473" y="364" width="96" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="473" y="376" width="64" height="5" rx="2.5" fill="#94a3b8"/>

  <!-- Floating Medical Assistant Card (Bottom Right) -->
  <g filter="url(#softShadow)">
    <rect x="520" y="295" width="215" height="165" rx="22" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="558" cy="336" r="20" fill="#ccfbf1"/>
    <path d="M550 336c0-4.4 3.6-8 8-8s8 3.6 8 8v3a8 8 0 0 1-16 0v-3z" fill="#0d9488"/>
    <rect x="590" y="324" width="115" height="8" rx="4" fill="#0f172a"/>
    <rect x="590" y="339" width="84" height="6" rx="3" fill="#64748b"/>
    <rect x="540" y="374" width="174" height="28" rx="10" fill="#f0fdfa"/>
    <rect x="552" y="385" width="130" height="6" rx="3" fill="#0f766e"/>
    <rect x="540" y="412" width="136" height="28" rx="10" fill="#0d9488"/>
    <rect x="556" y="423" width="98" height="6" rx="3" fill="#ffffff"/>
  </g>

  <!-- Floating Stethoscope Accent (Top Left) -->
  <g filter="url(#softShadow)">
    <rect x="55" y="128" width="106" height="106" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="108" cy="181" r="30" fill="#f0fdfa"/>
    <path d="M96 167v12a12 12 0 0 0 24 0v-12" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M108 191v9a7 7 0 0 0 14 0v-6" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="122" cy="191" r="5" fill="#0d9488"/>
  </g>
</svg>
